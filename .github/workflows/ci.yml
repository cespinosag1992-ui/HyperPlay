name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: NDK y CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Tests, lint y APK debug
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
