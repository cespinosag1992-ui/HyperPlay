name = "hyperplay-reports"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
GITHUB_REPO = "cespinosag1992-ui/HyperPlay"

# Limita envíos por IP y descarta duplicados (creado con: npx wrangler kv namespace create REPORTS_KV).
# Si despliegas tu propia copia, crea el tuyo y cambia el id.
[[kv_namespaces]]
binding = "REPORTS_KV"
id = "4eba172d6d7e4f4ea5cd634e4c487f5a"

# El token NO va aquí: npx wrangler secret put GITHUB_TOKEN
